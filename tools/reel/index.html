<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>BlackSheep Reel</title>
    <script src="assets/js/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: 'Bricolage Grotesque Variable';
        font-style: normal;
        font-weight: 200 800;
        src: url('assets/fonts/bricolage-grotesque.woff2') format('woff2-variations');
      }
      @font-face {
        font-family: 'Inter Variable';
        font-style: normal;
        font-weight: 100 900;
        src: url('assets/fonts/inter.woff2') format('woff2-variations');
      }

      :root {
        --ink: #0b0b0c;
        --ink-soft: #17171a;
        --paper: #f6f3ee;
        --line: #2a2a2e;
        --coral: #ff4b6e;
        --violet: #6c4cff;
        --teal: #12b7b0;
        --gold: #ffb238;
        --blue: #2e7dff;
        --orange: #ff7a1a;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ink);
        font-family: 'Inter Variable', ui-sans-serif, system-ui, sans-serif;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ink);
      }

      .scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: var(--ink);
      }

      /* The zoom wrapper is the thing every scene scales — never the .clip
         itself. Entrance: huge -> 1 (zooming OUT of a hidden close-up).
         Exit: 1 -> huge (zooming IN, into whatever the next scene reveals). */
      .zoom {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        will-change: transform;
      }

      .flash {
        position: absolute;
        inset: 0;
        background: var(--paper);
        opacity: 0;
        pointer-events: none;
        will-change: opacity;
      }

      .display {
        font-family: 'Bricolage Grotesque Variable', ui-sans-serif, system-ui, sans-serif;
        font-weight: 650;
        letter-spacing: -0.02em;
        color: var(--paper);
      }

      /* ---------- Scene A: logo reveal ---------- */
      #scene-a .mark {
        width: 220px;
        height: 220px;
        display: block;
      }
      #scene-a .wordmark {
        margin-top: 30px;
        font-size: 90px;
        display: flex;
        gap: 2px;
      }
      #scene-a .wordmark span {
        display: inline-block;
      }

      /* ---------- Scene B: kinetic headline ---------- */
      #scene-b .lede {
        font-size: 78px;
        line-height: 0.98;
        text-align: center;
      }
      #scene-b .lede .pre {
        display: block;
        padding-bottom: 0.15em;
      }
      #scene-b .move {
        margin-top: 8px;
        font-size: 182px;
        line-height: 0.92;
        display: flex;
      }
      #scene-b .letter {
        display: inline-block;
        color: var(--paper);
      }

      /* ---------- Scene C: category verbs ---------- */
      #scene-c {
        background: var(--coral);
      }
      #scene-c .verb-stage {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #scene-c .verb {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 124px;
        line-height: 1.02;
        text-align: center;
        padding: 0 120px;
        color: var(--ink);
        opacity: 0;
      }
      #scene-c .verb span {
        display: block;
      }

      /* ---------- Scene D: mascot mood ring ---------- */
      #scene-d {
        background: var(--ink-soft);
      }
      #scene-d .dots {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(var(--line) 2px, transparent 2.6px);
        background-size: 26px 26px;
        opacity: 0.4;
      }
      #scene-d .mascot-mark {
        width: 560px;
        height: 560px;
        -webkit-mask-image: url('assets/img/logo-mark.png');
        mask-image: url('assets/img/logo-mark.png');
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: var(--coral);
      }
      #scene-d .caption {
        position: absolute;
        left: 64px;
        bottom: 56px;
        font-family: 'Bricolage Grotesque Variable', sans-serif;
        font-weight: 600;
        font-size: 30px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: rgb(246 243 238 / 0.6);
        opacity: 0;
      }

      /* ---------- Scene E: sign-off ---------- */
      #scene-e .signoff-mark {
        width: 120px;
        height: 120px;
        opacity: 0;
      }
      #scene-e .wordmark {
        margin-top: 26px;
        font-size: 88px;
        opacity: 0;
      }
      #scene-e .tagline {
        margin-top: 16px;
        font-size: 28px;
        color: rgb(246 243 238 / 0.55);
        opacity: 0;
      }
      #scene-e .made {
        position: absolute;
        bottom: 56px;
        font-family: 'Bricolage Grotesque Variable', sans-serif;
        font-weight: 600;
        font-size: 24px;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--coral);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="reel"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="8.53"
    >
      <!-- Scene A: logo reveal, 0.00 - 1.05 -->
      <section id="scene-a" class="scene clip" data-start="0" data-duration="1.05">
        <div class="zoom" id="a-zoom" data-layout-allow-overflow="true">
          <img class="mark" id="a-mark" src="assets/img/logo-mark.png" alt="" />
          <div class="wordmark display">
            <span id="a-w0">B</span><span id="a-w1">L</span><span id="a-w2">A</span><span id="a-w3">C</span><span id="a-w4">K</span><span id="a-w5">S</span><span id="a-w6">H</span><span id="a-w7">E</span><span id="a-w8">E</span><span id="a-w9">P</span>
          </div>
        </div>
        <div class="flash" id="a-flash"></div>
      </section>

      <!-- Scene B: kinetic headline, 1.05 - 2.33 -->
      <section id="scene-b" class="scene clip" data-start="1.05" data-duration="1.28">
        <div class="zoom" id="b-zoom" data-layout-allow-overflow="true">
          <div class="lede display">
            <span class="pre" id="b-pre">WE MAKE THINGS</span>
          </div>
          <div class="move display">
            <span class="letter" id="b-l0">M</span><span class="letter" id="b-l1">O</span><span class="letter" id="b-l2">V</span><span class="letter" id="b-l3">E</span><span class="letter" id="b-l4">.</span>
          </div>
        </div>
        <div class="flash" id="b-flash"></div>
      </section>

      <!-- Scene C: category verbs, 2.33 - 5.03 -->
      <section id="scene-c" class="scene clip" data-start="2.33" data-duration="2.70">
        <div class="zoom" id="c-zoom" data-layout-allow-overflow="true">
          <div class="verb-stage">
            <div class="verb display" id="c-v0"><span>MAKE IT</span><span>A BRAND.</span></div>
            <div class="verb display" id="c-v1"><span>MAKE IT</span><span>MOVE.</span></div>
            <div class="verb display" id="c-v2"><span>MAKE IT</span><span>DIGITAL.</span></div>
            <div class="verb display" id="c-v3"><span>MAKE IT</span><span>SEEN.</span></div>
            <div class="verb display" id="c-v4"><span>MAKE IT</span><span>READ.</span></div>
            <div class="verb display" id="c-v5"><span>MAKE IT</span><span>WEIRD.</span></div>
          </div>
        </div>
        <div class="flash" id="c-flash"></div>
      </section>

      <!-- Scene D: mascot mood ring, 5.03 - 6.93 -->
      <section id="scene-d" class="scene clip" data-start="5.03" data-duration="1.90">
        <div class="dots"></div>
        <div class="zoom" id="d-zoom" data-layout-allow-overflow="true">
          <div class="mascot-mark" id="d-mark"></div>
          <p class="caption" id="d-caption">Mood: unpredictable</p>
        </div>
        <div class="flash" id="d-flash"></div>
      </section>

      <!-- Scene E: sign-off, 6.93 - 8.53 -->
      <section id="scene-e" class="scene clip" data-start="6.93" data-duration="1.60">
        <div class="zoom" id="e-zoom" data-layout-allow-overflow="true">
          <img class="signoff-mark" id="e-mark" src="assets/img/logo-mark-signoff.png" alt="" />
          <div class="wordmark display" id="e-wordmark">BLACKSHEEP</div>
          <p class="tagline" id="e-tagline">Graphic &amp; Motion Designer</p>
          <p class="made" id="e-made">Coded, not filmed.</p>
        </div>
      </section>
    </div>

    <script>
      var tl = gsap.timeline({ paused: true });
      var CORAL = '#ff4b6e';
      var VIOLET = '#6c4cff';
      var TEAL = '#12b7b0';
      var GOLD = '#ffb238';
      var BLUE = '#2e7dff';
      var ORANGE = '#ff7a1a';

      // ---------- shared zoom-cut helper ----------
      // Every scene's .zoom wrapper zooms OUT from a huge close-up on entry
      // (the "hidden image" reveal) and, except the last scene, zooms back
      // IN to a huge close-up right before the hard cut -- so each cut reads
      // as diving straight through the frame into the next one.
      function zoomIn(sel, start, dur, fromScale, origin) {
        tl.set(sel, { transformOrigin: origin || '50% 50%' }, start);
        tl.fromTo(sel, { scale: fromScale }, { scale: 1, duration: dur, ease: 'power3.out' }, start);
      }
      function zoomOut(sel, start, dur, toScale, origin) {
        tl.set(sel, { transformOrigin: origin || '50% 50%' }, start);
        tl.to(sel, { scale: toScale, duration: dur, ease: 'power3.in' }, start);
      }
      function cutFlash(sel, at, dur) {
        tl.set(sel, { opacity: 0.85 }, at);
        tl.to(sel, { opacity: 0, duration: dur || 0.14, ease: 'power2.out' }, at);
      }

      /* ---------- Scene A: logo reveal, 0.00 - 1.05 ---------- */
      zoomIn('#a-zoom', 0, 0.38, 4.2, '54% 42%');
      tl.fromTo('#a-mark', { opacity: 0 }, { opacity: 1, duration: 0.18 }, 0);
      var aLetters = ['#a-w0', '#a-w1', '#a-w2', '#a-w3', '#a-w4', '#a-w5', '#a-w6', '#a-w7', '#a-w8', '#a-w9'];
      aLetters.forEach(function (sel, i) {
        tl.fromTo(sel, { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.2, ease: 'power3.out' }, 0.26 + i * 0.02);
      });
      zoomOut('#a-zoom', 0.72, 0.3, 6, '50% 44%');
      cutFlash('#a-flash', 1.0);

      /* ---------- Scene B: kinetic headline, 1.05 - 2.33 ---------- */
      zoomIn('#b-zoom', 1.05, 0.35, 6, '28% 70%');
      tl.fromTo('#b-pre', { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.2, ease: 'power3.out' }, 1.14);

      var moveLetters = ['#b-l0', '#b-l1', '#b-l2', '#b-l3', '#b-l4'];
      var center = (moveLetters.length - 1) / 2;
      moveLetters.forEach(function (sel, i) {
        var dir = center === 0 ? 0 : (i - center) / center;
        var fromState = { x: dir * 60, y: -12 + (i % 2) * 22, rotation: dir * 12, scale: 0.9, opacity: 0.3 };
        var toState = { x: 0, y: 0, rotation: 0, scale: 1, opacity: 1, duration: 0.4, ease: 'power3.out' };
        tl.fromTo(sel, fromState, toState, 1.4 + i * 0.045);
      });
      tl.fromTo(
        '#scene-b .move',
        { filter: 'brightness(1)' },
        { filter: 'brightness(1.6)', duration: 0.08, ease: 'none', yoyo: true, repeat: 1 },
        1.95
      );
      zoomOut('#b-zoom', 2.05, 0.28, 7, '86% 78%');
      cutFlash('#b-flash', 2.31);

      /* ---------- Scene C: category verbs (hard strobe cuts), 2.33 - 5.03 ---------- */
      zoomIn('#c-zoom', 2.33, 0.3, 7, '50% 50%');
      var verbs = [
        { sel: '#c-v0', bg: CORAL, t: 2.63 },
        { sel: '#c-v1', bg: VIOLET, t: 2.99 },
        { sel: '#c-v2', bg: TEAL, t: 3.35 },
        { sel: '#c-v3', bg: GOLD, t: 3.71 },
        { sel: '#c-v4', bg: BLUE, t: 4.07 },
        { sel: '#c-v5', bg: ORANGE, t: 4.43 },
      ];
      verbs.forEach(function (v, i) {
        tl.set('#scene-c', { backgroundColor: v.bg }, v.t);
        tl.set(v.sel, { opacity: 1 }, v.t);
        tl.fromTo(v.sel, { scale: 1.14 }, { scale: 1, duration: 0.24, ease: 'power3.out' }, v.t);
        var nextT = i < verbs.length - 1 ? verbs[i + 1].t : 4.79;
        tl.set(v.sel, { opacity: 0 }, nextT);
      });
      zoomOut('#c-zoom', 4.79, 0.24, 8, '50% 50%');
      cutFlash('#c-flash', 4.97);

      /* ---------- Scene D: mascot mood ring, 5.03 - 6.93 ---------- */
      zoomIn('#d-zoom', 5.03, 0.3, 8, '50% 50%');
      var dColors = [CORAL, TEAL, ORANGE, VIOLET];
      var dStart = 5.07;
      var dStep = 0.32;
      dColors.forEach(function (c, i) {
        tl.set('#d-mark', { backgroundColor: c, rotate: i % 2 === 0 ? -3 : 3 }, dStart + i * dStep);
      });
      tl.set('#d-mark', { rotate: 0 }, dStart + dColors.length * dStep + 0.05);
      tl.fromTo('#d-caption', { opacity: 0 }, { opacity: 1, duration: 0.25, ease: 'power3.out' }, 5.33);
      tl.to('#d-mark', { scale: 1.06, duration: 0.5, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 5.63);
      zoomOut('#d-zoom', 6.63, 0.3, 9, '50% 50%');
      cutFlash('#d-flash', 6.85);

      /* ---------- Scene E: sign-off, 6.93 - 8.53 ---------- */
      zoomIn('#e-zoom', 6.93, 0.4, 9, '50% 55%');
      tl.fromTo('#e-mark', { opacity: 0 }, { opacity: 1, duration: 0.25 }, 7.03);
      tl.fromTo('#e-wordmark', { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power3.out' }, 7.28);
      tl.fromTo('#e-tagline', { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power3.out' }, 7.53);
      tl.fromTo('#e-made', { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power3.out' }, 7.73);

      window.__timelines['reel'] = tl;
    </script>
  </body>
</html>
